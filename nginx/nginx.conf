events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream backend_nodes {
        # Round-robin load balancing across multiple backend instances
        server backend-1:5000;
        server backend-2:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Gzip compression for performance
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # Frontend static files & single page application routing
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API Routes load balanced across backend-1 and backend-2
        location /api/ {
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health & Metrics Monitoring
        location /health {
            proxy_pass http://backend_nodes/health;
        }

        location /metrics {
            proxy_pass http://backend_nodes/metrics;
        }
    }
}
