version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: url_shortener_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Anything in this folder runs ONCE, automatically, the first time
      # the container creates its data volume (i.e. schema setup).
      - ./init:/docker-entrypoint-initdb.d

volumes:
  pg_data:
